# ─── Render Blueprint ───────────────────────────────────────
# Deploys both the Express API and the React storefront.
# https://docs.render.com/infrastructure-as-code

services:
  # ── Backend API (Express + Prisma + SQLite) ──
  - type: web
    name: techno-world-api
    runtime: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
    healthCheckPath: /
    autoDeploy: true

  # ── Frontend Storefront (React + Vite) ──
  - type: web
    name: techno-world-frontend
    runtime: static
    rootDir: app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true

