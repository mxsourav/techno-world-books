    <script>
      (function() {
        try {
          var raw = localStorage.getItem('techno_world_theme_palette');
          if (raw) {
            var p = JSON.parse(raw);
            var root = document.documentElement;
            if (p.dark) root.style.setProperty('--brand-dark', p.dark);
            if (p.base) root.style.setProperty('--brand-base', p.base);
            if (p.light) root.style.setProperty('--brand-light', p.light);
            if (p.pitch) root.style.setProperty('--brand-pitch', p.pitch);
            if (p.subtle) root.style.setProperty('--brand-subtle', p.subtle);
            if (p.soft) root.style.setProperty('--brand-soft', p.soft);
            var topColor = p.base || p.dark;
            if (topColor) {
              var metas = document.querySelectorAll('meta[name="theme-color"], meta[name="msapplication-navbutton-color"]');
              for (var i = 0; i < metas.length; i++) {
                metas[i].setAttribute('content', topColor);
              }
            }
          }
        } catch (e) {}
      })();
    </script>
